apiVersion: apps/v1
kind: Deployment
metadata:
  name: preprod-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preprod-website
  template:
    metadata:
      labels:
        app: preprod-website
    spec:

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - preprod-website
                topologyKey: failure-domain.beta.kubernetes.io/zone
              weight: 100
      containers:
        - name: preprod-website
          image: ghcr.io/homebithub/preprod-website:20260818180155
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            # preprod's own socket. This named production, whose /ws is served
            # by production's notifications service and rejects an origin of
            # preprod.homebit.co.ke — so the connection was refused and the
            # inbox, the unread badge and every live update on preprod went
            # with it. The preprod website host has no /ws route of its own;
            # preprod-api does, and it points at preprod-notifications-srv.
            - name: NOTIFICATIONS_WS_BASE_URL
              value: "https://preprod-api.homebit.co.ke/ws"
            - name: AUTH_GRPC_BASE_URL
              value: "http://preprod-auth-srv-headless:5004"
            - name: GATEWAY_API_BASE_URL
              value: "https://preprod-api.homebit.co.ke"
            - name: NOTIFICATIONS_API_BASE_URL
              value: "https://preprod-api.homebit.co.ke"
            - name: GOOGLE_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: google-maps-browser
                  key: api-key
                  optional: true
            - name: GOOGLE_MAPS_MAP_ID
              valueFrom:
                secretKeyRef:
                  name: google-maps-browser
                  key: map-id
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
      imagePullSecrets:
        - name: ghcr-secret
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: preprod-website-srv
spec:
  selector:
    app: preprod-website
  ports:
    - name: preprod-website
      protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
