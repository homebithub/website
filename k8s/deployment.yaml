apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - website
                topologyKey: failure-domain.beta.kubernetes.io/zone
              weight: 100
      containers:
        - name: website
          image: ghcr.io/homebithub/website:20260611172545
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: NOTIFICATIONS_WS_BASE_URL
              value: "https://homebit.co.ke/ws"
            - name: AUTH_GRPC_BASE_URL
              value: "http://auth-srv-headless:5004"
            - name: GATEWAY_API_BASE_URL
              value: "https://api.homebit.co.ke"
            - name: NOTIFICATIONS_API_BASE_URL
              value: "https://api.homebit.co.ke"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
      imagePullSecrets:
        - name: ghcr-secret
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: website-srv
spec:
  selector:
    app: website
  ports:
    - name: website
      protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
