syntax = "proto3";

package auth;

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";

// Browser-only subsets used by the persistent navigation and browse pages.
service ShortlistService {
  rpc CreateShortlist(CreateShortlistReq) returns (JsonResponse);
  rpc DeleteShortlist(IdRequest) returns (google.protobuf.Empty);
  rpc ListByHousehold(UserIdRequest) returns (JsonResponse);
  rpc GetShortlistCount(UserIdRequest) returns (CountResponse);
}

service HireRequestService {
  rpc ListHireRequests(ListHireRequestsReq) returns (JsonResponse);
}

message IdRequest { string id = 1; string user_id = 2; }
message UserIdRequest { string user_id = 1; string profile_type = 2; }
message CountResponse { int64 count = 1; }
message JsonResponse { google.protobuf.Struct data = 1; }

message CreateShortlistReq {
  string user_id = 1;
  string profile_type = 2;
  google.protobuf.Struct data = 3;
}

message ListHireRequestsReq {
  string user_id = 1;
  string profile_type = 2;
  string status = 3;
  int32 limit = 4;
  int32 offset = 5;
}
